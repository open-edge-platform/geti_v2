task: detection
capabilities:
  tiling: true  # by default, all detection models support tiling (unless specified otherwise)

hyperparameters:
  dataset_preparation:
      tiling:
        enable: false
        adaptive_tiling: false
        tile_size: 400
        tile_overlap: 0.2
  evaluation:
    metric: f_measure
  training:
    max_epochs: 200
    early_stopping:
      enable: true
      patience: 10
