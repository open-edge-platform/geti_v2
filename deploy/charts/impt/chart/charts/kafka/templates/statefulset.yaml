---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "kafka.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "kafka.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kafka.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          command: ["/bin/bash", "-c"]
          args:
            - >
              /etc/kafka/scripts/init.sh &&
              /etc/kafka/docker/run
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: KAFKA_NODE_ID
              value: {{ .Values.kraft.nodeId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: {{ .Values.kraft.roles | quote }}
            - name: KAFKA_CLUSTER_ID
              value: {{ .Values.kraft.clusterId | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@$(MY_POD_NAME).impt-kafka-headless.impt.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL
              value: "PLAIN"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "CLIENT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:SASL_PLAINTEXT,CLIENT:SASL_PLAINTEXT"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "PLAIN,SCRAM-SHA-256,SCRAM-SHA-512"
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: "PLAIN"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://:9093,CLIENT://:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "CLIENT://$(MY_POD_NAME).impt-kafka-headless.impt.svc.cluster.local:9092"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_CLIENT_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Namespace }}-kafka-jaas
                  key: client-users
            - name: KAFKA_CLIENT_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Namespace }}-kafka-jaas
                  key: client-passwords
            - name: KAFKA_INTER_BROKER_USER
              valueFrom:
                secretKeyRef:
                  key: inter-broker-user
                  name: impt-kafka-jaas
            - name: KAFKA_INTER_BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: inter-broker-password
                  name: impt-kafka-jaas
            - name: KAFKA_DELETE_TOPIC_ENABLE
              value: "false"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: -Xmx1024m -Xms1024m
            - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
              value: "10000"
            - name: KAFKA_LOG_FLUSH_INTERVAL_MS
              value: "1000"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVALS_MS
              value: "300000"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "1000012"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_DIRS
              value: '/tmp/kraft-combined-logs'
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_IO_THREADS
              value: "8"
            - name: KAFKA_NUM_NETWORK_THREADS
              value: "3"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_NUM_RECOVERY_THREADS_PER_DATA_DIR
              value: "1"
            - name: KAFKA_SOCKET_RECEIVE_BUFFER_BYTES
              value: "102400"
            - name: KAFKA_SOCKET_REQUEST_MAX_BYTES
              value: "104857600"
            - name: KAFKA_SOCKET_SEND_BUFFER_BYTES
              value: "102400"
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "true"
            - name: KAFKA_SUPER_USERS
              value: User:admin
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR
              value: "1"
            - name: KAFKA_HOME
              value: /opt/kafka
            - name: KAFKA_CONF_FILE
              value: /opt/kafka/config/server.properties
          volumeMounts:
            - name: config
              mountPath: /etc/kafka/scripts/
      volumes:
        - name: config
          configMap:
            name: {{ include "kafka.fullname" . }}
