---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
data:
  kafka_jaas.sh: |-
    #!/bin/bash
    set -e
    
    # Read usernames and passwords from environment variables
    IFS=',' read -r -a users <<< "${KAFKA_CLIENT_USERS}"
    IFS=',' read -r -a passwords <<< "${KAFKA_CLIENT_PASSWORDS}"
    
    # Start building the KafkaServer JAAS configuration
    jaas_config="KafkaServer {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username=admin
        password=\"${KAFKA_ADMIN_PASSWORD}\"
        user_admin=\"${KAFKA_ADMIN_PASSWORD}\""
    
    # Add user_<name>="<password>" entries
    for ((i = 0; i < ${#users[@]}; i++)); do
        jaas_config+="
        user_${users[i]}=\"${passwords[i]}\""
    done
    
    # Close the JAAS configuration
    jaas_config+=";
    };"
    
    # Write the configuration to the Kafka JAAS file
    echo "$jaas_config" > /opt/kafka/config/kafka_server_jaas.conf
