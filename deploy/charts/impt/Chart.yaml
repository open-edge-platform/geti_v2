  - name: web
    version: 0.0.5
    condition: enabled.web
  - name: impt-configuration
    version: 0.0.9
    condition: enabled.impt-configuration
  - name: geti-common
    version: 0.0.1
  - name: geti-common-labels
    version: 0.0.1
  - name: bitnami-common
    version: 1.11.2
  - name: kafka
    version: 15.3.6
    condition: enabled.kafka
  - name: kafka-provisioning
    version: 15.3.6
    condition: enabled.kafka-provisioning
  - name: kafka-proxy
    version: v0.1.13
    condition: enabled.kafka-proxy
  - name: mongodb
