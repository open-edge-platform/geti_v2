# Libraries tests & style checks workflow (Geti project)
#
# This reusable workflow runs static analysis (style / lint / static code analysis) and
# executes tests for a specified library/component directory. It is designed to be
# invoked by higher-level pipelines via `workflow_call` or run manually with
# `workflow_dispatch` for ad‑hoc validation.
#
# Key Features:
# - Parameterized target component directory (root‑relative)
# - Multi‑language environment support (Python via uv, Go via setup-go)
# - Static code analysis (Make target) and test execution (Make target)
#
# Process Stages:
# 1. Checkout source (read-only credentials)
# 2. Provision system/package dependencies (apt, uv, Go toolchain)
# 3. Run static code analysis (make <component>/static-code-analysis)
# 4. Run tests (make <component>/tests)
#
# Inputs (workflow_call):
# - component-dir: Root-relative path of the component/library to validate (required)
#

name: Libraries - tests and stylechecks

on:
  workflow_call:
    inputs:
      component-dir:
        description: "Dir in root directory"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      component-dir:
        description: "Path to the component (relative to the root of the repository)"
        required: true

permissions: {} # No permissions by default on workflow level

env:
  COMPONENT_DIR: ${{ inputs.component-dir  }}

jobs:
  component-tests:
    name: Component workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install missing dependencies
        run: |
          sudo -E apt update
          sudo -E apt install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: "0.7.13"

      - name: Setup GO
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24"

      - name: Static code analysis
        run: make -C "${COMPONENT_DIR}" static-code-analysis

      - name: Tests
        run: make -C "${COMPONENT_DIR}" tests
