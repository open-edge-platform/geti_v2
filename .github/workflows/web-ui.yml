# Web UI workflow for the Geti project
#
# This reusable workflow builds, lints, type‑checks, and tests the Web UI layer
# (unit + component tests) and then optionally invokes the component workflow
# to publish artifacts when requested.
#
# Key Features:
# - Produces a production build tarball (compressed build artifact)
# - Runs formatting (Prettier), lint (ESLint), cyclic import detection, and TypeScript checks
# - Executes sharded Jest unit tests (5 shards) for parallel speed‑up
# - Executes sharded Playwright component tests (5 shards) in a pinned container image
# - Merges Playwright shard blob reports into a single HTML report
# - Invokes nested component workflow (component.yml) for downstream publish / distribution steps
#
# Process Stages:
# 1. Build UI (compile & compress)
# 2. Lint & formatting & type checking
# 3. Sharded unit tests (Jest)
# 4. Sharded component tests (Playwright)
# 5. Merge Playwright reports (HTML)
# 6. Invoke component workflow (optional publish)
#
# Inputs (workflow_call):
# - build_version: Version string applied to produced artifacts (required)
# - publish_binaries: Whether to trigger publishing flow in the component workflow (default: false)
# - registry: The container registry to push images to
#

name: Web UI checks

on:
  workflow_call:
    inputs:
      build_version:
        description: "Specifies the build version to apply to all binaries produced by this workflow"
        type: string
        required: true
      publish_binaries:
        description: "Enable publishing binaries to repos"
        type: boolean
        default: false
      registry:
        description: "The container registry to push images to"
        type: string
        required: true

permissions: {} # No permissions by default on workflow level

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        id: setup-node
        with:
          node-version-file: web_ui/.nvmrc

      - name: Install dependencies
        working-directory: "web_ui"
        run: npm ci

      - name: Build UI
        working-directory: "web_ui"
        run: npm run build:all-routes

      - name: Compress build
        working-directory: "web_ui"
        run: tar -czf build.tar.gz build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: webui-build
          path: "web_ui/build.tar.gz"

  lint:
    name: Eslint checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        id: setup-node
        with:
          node-version-file: web_ui/.nvmrc

      - name: Install dependencies
        working-directory: "web_ui"
        run: npm ci

      - name: Prettier
        working-directory: "web_ui"
        run: npm run format:check

      - name: Eslint
        working-directory: "web_ui"
        run: npm run lint

      - name: Eslint cyclic imports
        working-directory: "web_ui"
        run: npm run cyclic-deps-check

      - name: Typescript
        working-directory: "web_ui"
        run: npm run type-check

  unit-tests:
    name: Jest tests (${{ matrix.shard }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout code
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shardTotal: [5]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        id: setup-node
        with:
          node-version-file: web_ui/.nvmrc

      - name: Install dependencies
        working-directory: "web_ui"
        run: npm ci

      - name: UI Unit tests
        working-directory: "web_ui"
        run: npm run test:unit -- --silent --maxWorkers=2 --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}

  playwright-tests:
    name: Playwright Tests (${{ matrix.shard }}/${{ matrix.shardTotal }})
    needs: build
    permissions:
      contents: read # to checkout code
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy@sha256:6aca677c27a967caf7673d108ac67ffaf8fed134f27e17b27a05464ca0ace831
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shardTotal: [5]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        id: setup-node
        with:
          node-version-file: web_ui/.nvmrc

      - name: Install dependencies
        working-directory: "web_ui"
        run: npm ci

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: webui-build
          path: "web_ui"

      - name: Unpack build
        working-directory: "web_ui"
        run: tar -xzf build.tar.gz

      - name: Run Playwright tests
        working-directory: "web_ui"
        run: npm run test:component -- --project "chromium" --project "chromium mini viewport" --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Upload blob report to GitHub Actions Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: playwright-blob-reports-${{ matrix.shard }}
          path: web_ui/blob-report
          retention-days: 1

  merge-playwright-reports:
    # Merge reports after playwright-tests, even if some shards have failed
    if: always()
    needs: [playwright-tests]
    permissions:
      contents: read # to checkout code
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        id: setup-node
        with:
          node-version-file: web_ui/.nvmrc

      - name: Install dependencies
        working-directory: "web_ui"
        run: npm ci

      - name: Download playwright blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: playwright-blob-reports-*
          path: web_ui/playwright-blob-reports
          merge-multiple: true

      - name: Merge into HTML Report
        working-directory: "web_ui"
        run: npx playwright merge-reports --reporter html ./playwright-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-html-report-attempt-${{ github.run_attempt }}
          path: web_ui/playwright-report
          retention-days: 14

  component-workflow:
    name: Component workflow
    needs: [lint, unit-tests, merge-playwright-reports]
    permissions:
      contents: read # to checkout code
      packages: write # to publish packages
    uses: ./.github/workflows/component.yml
    with:
      build_version: ${{ inputs.build_version }}
      component_dir: web_ui
      publish_binaries: ${{ inputs.publish_binaries }}
      registry: ${{ inputs.registry }}
