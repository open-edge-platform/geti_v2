name: "CodeQL Scan"

# zizmor ignore: This workflow does not generate artifacts, setup-go is used to execute CodeQL
on: # zizmor: ignore[cache-poisoning]
  pull_request:
    branches:
      - main
      - release**
  push:
    branches:
      - main
      - release**
  schedule:
    - cron: "37 3 * * 0"

permissions: {} # No permissions by default on workflow level

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to publish sarif

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Free space on runner (delete unnecessary tools)
        shell: bash
        run: |
          echo "Free space before deletion:"
          df -h /
          rm -rf /opt/hostedtoolcache || true
          if [ -f /swapfile ]; then
            sudo swapoff -a
            sudo rm -f /swapfile
          fi
          echo "Free space after deletion:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup GO
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.24"

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b168cd39490f61582a9beae412bb7057a6b2c4e # v4.31.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b168cd39490f61582a9beae412bb7057a6b2c4e # v4.31.8
        with:
          category: "/language:${{matrix.language}}"
