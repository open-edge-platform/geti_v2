# Platform package distribution workflow (Geti project)
#
# This reusable workflow builds the platform umbrella Helm charts and (optionally)
# the installer distribution artifacts, then publishes them when enabled.
# It is triggered via `workflow_call` by upstream CI orchestrations that decide
# whether to run a full multi‑component build (build_all) and whether publishing
# is permitted (publish_binaries).
#
# Key Features:
# - Conditional execution (skips entirely unless `build_all` is true)
# - Builds umbrella Helm charts (Make targets) and optionally publishes them
# - Generates a versioned installer binary bundle (tar.gz) embedding product & build versions
# - Produces an uploadable artifact for downstream consumption (platform_installer)
#
# Process Stages:
# 1. Checkout source
# 2. Build umbrella charts
# 3. (Optional) Publish umbrella charts
# 4. (Optional) Build installer binary (version info injected)
# 5. (Optional) Package & upload installer artifact
#
# Inputs (workflow_call):
# - build_all (boolean, required): Gate to execute the distribution stage
# - build_version (string, required): Build identifier applied to binaries / tags
# - platform_version (string, required): Current platform semantic version
# - publish_binaries (boolean, default: false): Enable publishing & installer packaging
# - registry (string, required): Container registry namespace for chart/image publication
#

name: Package distribution workflow
on:
  workflow_call:
    inputs:
      build_all:
        description: "If the triggering workflow is running in build-all-components mode"
        type: boolean
        required: true
      build_version:
        description: "Specifies the build version to apply to all binaries produced by this workflow"
        type: string
        required: true
      platform_version:
        description: "Specifies the current Geti platform version"
        type: string
        required: true
      publish_binaries:
        description: "Enable pushing Docker images and Helm charts"
        type: boolean
        default: false
      registry:
        description: "The container registry to push images to"
        type: string
        required: true
permissions: {} # No permissions by default on workflow level

jobs:
  package-distribution-workflow:
    name: Build platform distribution binaries
    runs-on: ubuntu-latest
    if: ${{ inputs.build_all }}
    permissions:
      contents: read
      packages: write # to publish packages
    env:
      TAG: ${{ inputs.build_version }}
      PLATFORM_VERSION: ${{ inputs.platform_version }}
      REGISTRY: ${{ inputs.registry }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Build umbrella charts
        run: make build-umbrella-chart

      - name: Login to GitHub Container Registry
        if: ${{ inputs.publish_binaries }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish umbrella charts
        if: ${{ inputs.publish_binaries }}
        run: make publish-umbrella-chart

      - name: Build installer binary
        if: ${{ inputs.publish_binaries }}
        working-directory: platform/services/installer
        run: |
          printf "product_version: %s\nproduct_build: %s\n" "$PLATFORM_VERSION" "$TAG" > app/version.yaml
          make build
          tar -czf platform_installer.tar.gz platform_$TAG

      - name: Upload build artifacts
        if: ${{ inputs.publish_binaries }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: platform_installer
          path: platform/services/installer/platform_installer.tar.gz
          retention-days: 14
