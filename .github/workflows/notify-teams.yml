permissions: {}

name: Notify Teams on UI PR Creation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "web_ui/**"

jobs:
  notify-teams:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Notify Teams via Webhook
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const card = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0076D7",
              "title": `🔔 New UI Pull Request Created!`,
              "text": pr.body ? pr.body.substring(0, 300) : '_No description provided._',
              "sections": [{
                "activityTitle": `**Title:** [${pr.title}](${pr.html_url})`,
                "facts": [
                  { "name": "Author", "value": pr.user.login },
                  { "name": "Branch", "value": `\`${pr.head.ref}\` → \`${pr.base.ref}\`` },
                  { "name": "PR Link", "value": `[View PR](${pr.html_url})` }
                ]
              }]
            };
            await fetch(process.env.TEAMS_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(card)
            });
