# Component build & test workflow (Geti project)
#
# This reusable workflow performs static analysis, unit & integration testing,
# optional container image build/publish, and Helm chart lint/publish for a single
# component directory. It supports both Python and Go projects via builder images
# and can be invoked directly (workflow_dispatch) or from higher‑level orchestration
# (workflow_call) with versioning and publish controls.
#
# Key Features:
# - Auto-detects project language (Python / Go) and selects appropriate builder image
# - Runs static code analysis, unit tests, integration tests (builder vs host fallback)
# - Conditional cleanup phases (initial / pre-build / all) via component config action
# - Skips image build gracefully if Make target indicates so (captures SKIP_IMAGE flag)
# - Optionally logs into GHCR and publishes image & Helm chart when publish_binaries=true
# - Injects build/version tag (TAG) with fallback to commit SHA
#
# Process Stages:
# 1. Checkout & component configuration read
# 2. Optional initial cleanup
# 3. Language detection & builder image selection
# 4. Static code analysis
# 5. Unit tests
# 6. Integration tests (builder or host + ffmpeg install when needed)
# 7. Optional pre-build cleanup
# 8. Container image build (skip-aware)
# 9. (Optional) Image push & chart lint
# 10. (Optional) Chart publish
#
# Inputs (workflow_call / dispatch):
# - component_dir (string, required): Root-relative path of the component
# - build_version (string, required): Version tag applied to built artifacts (fallback to commit)
# - publish_binaries (bool, default false): Enable push of image & Helm chart
# - registry (string, required): Target container registry base
#

name: Components workflow

on:
  workflow_call:
    inputs:
      component_dir:
        description: "Dir in root directory"
        type: string
        required: true
      build_version:
        description: "Specifies the build version to apply to all binaries produced by this workflow"
        type: string
        required: true
      publish_binaries:
        description: "Enable publishing binaries to repos"
        type: boolean
        default: false
      registry:
        description: "The container registry to push images to"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      component_dir:
        description: "Path to the component (relative to the root of the repository)"
        required: true

permissions: {} # No permissions by default on workflow level

env:
  COMPONENT_DIR: ${{ inputs.component_dir }}

jobs:
  component-check:
    name: Component workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.build_version || github.sha }}
      # Update these when the tags in dev_tools/builder_images/*/Makefile are updated.
      # Remember that new tags will be available only after the code with the change is merged
      # and the builder image workflow is run and completed successfully.
      REGISTRY: ${{ inputs.registry }}
      BUILDER_REGISTRY: ghcr.io/open-edge-platform/geti/builders
      PYTHON_BUILDER_IMAGE: python-builder:v1.0.1
      GO_BUILDER_IMAGE: go-builder:v1.0.0
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Read component config
        id: component-config
        uses: ./.github/actions/read-component-config
        with:
          component_dir: ${{ env.COMPONENT_DIR }}

      - name: Initial cleanup
        if: steps.component-config.outputs.cleanup_type == 'initial' || steps.component-config.outputs.cleanup_type == 'all'
        uses: ./.github/actions/cleanup-runner
        with:
          type: "initial"

      - name: Check if Python/Go project
        id: check-python-go
        run: |
          BUILDER_IMAGE=""
          if [ -f "${COMPONENT_DIR}/setup.py" ] || [ -f "${COMPONENT_DIR}/pyproject.toml" ] || [ -f "${COMPONENT_DIR}/.python" ]; then
            BUILDER_IMAGE=${BUILDER_REGISTRY}/${PYTHON_BUILDER_IMAGE}
          elif [ -f "${COMPONENT_DIR}/go.mod" ] || [ -f "${COMPONENT_DIR}/.go" ]; then
            BUILDER_IMAGE=${BUILDER_REGISTRY}/${GO_BUILDER_IMAGE}
          fi
          echo "BUILDER_IMAGE=${BUILDER_IMAGE}" >> $GITHUB_ENV
          echo "BUILDER_IMAGE=${BUILDER_IMAGE}"

      - name: Static code analysis
        run: make builder -C "${COMPONENT_DIR}" static-code-analysis

      - name: Unit testing
        run: make builder -C "${COMPONENT_DIR}" test-unit

      - name: Integration testing
        env:
          INPUTS_INTEGRATION_BUILDER: ${{ steps.component-config.outputs.integration_builder }}
        run: |
          if [[ "$INPUTS_INTEGRATION_BUILDER" == "false" ]]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg && make -C "${COMPONENT_DIR}" test-integration
          else
            make builder -C "${COMPONENT_DIR}" test-integration
          fi

      - name: Pre-build cleanup
        if: steps.component-config.outputs.cleanup_type == 'pre-build' || steps.component-config.outputs.cleanup_type == 'all'
        uses: ./.github/actions/cleanup-runner
        with:
          type: "pre-build"

      - name: Build image
        id: build-image
        run: |
          OUTPUT=$(make -C "${COMPONENT_DIR}" build-image)
          if echo "$OUTPUT" | grep -q "Skipping"; then
            echo "SKIP_IMAGE=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.build-image.outputs.SKIP_IMAGE != 'true' && inputs.publish_binaries
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: steps.build-image.outputs.SKIP_IMAGE != 'true' && inputs.publish_binaries
        run: make -C "${COMPONENT_DIR}" publish-image

      - name: Lint chart
        if: steps.build-image.outputs.SKIP_IMAGE != 'true'
        run: make -C "${COMPONENT_DIR}" lint-chart

      - name: Publish chart
        if: steps.build-image.outputs.SKIP_IMAGE != 'true' && inputs.publish_binaries
        run: make -C "${COMPONENT_DIR}" publish-chart
