# GHCR cleanup workflow
#
# This workflow deletes old package versions from GHCR registry.
# 
# Key Features:
# - Deletes old package versions from GHCR registry
# - Can be triggered manually or by other workflows
# - Supports dry run mode to preview changes
# 
# Process Stages:
# 1. Prepare list of package versions to delete
# 2. Delete old package versions
#
# Inputs:
# - package_name: The name of the package to clean up
# - max_days_old: The maximum age of packages to keep (in days)
# - dry_run: Perform a dry run without deleting packages
#
# Example usage:
# 1. Call this workflow manually from Github Actions page
# 2. Trigger this workflow from another workflow using the `workflow_call` event:
#    uses: ./.github/workflows/cleanup-old-packages.yml
#    with:
#      package_name: "your-package-name"
#      max_days_old: 5
#      dry_run: true

name: Cleanup old packages from daily builds

on:
  workflow_call:
    inputs:
      package_name:
        description: "The name of the package to clean up"
        type: string
        required: true
      max_days_old:
        description: "The maximum age of packages to keep (in days)"
        type: number
        default: 5
      dry_run:
        description: "Perform a dry run without deleting packages"
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      package_name:
        description: "The name of the package to clean up"
        type: string
        required: true
      max_days_old:
        description: "The maximum age of packages to keep (in days)"
        type: number
        default: 5
      dry_run:
        description: "Perform a dry run without deleting packages"
        type: boolean
        default: true

permissions: {}

jobs:
  prepare-vars:
    runs-on: ubuntu-latest
    outputs:
      package_version_ids: ${{ steps.prepare-versions.outputs.package_version_ids }}
    steps:
      - name: Prepare list of package ids to delete
        id: prepare-versions
        env: 
          MAX_DAYS_OLD: ${{ github.event.inputs.max_days_old }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          echo "Preparing list of package:"$PACKAGE_NAME" ids to delete from ghcr.io..."
          # Add logic to populate package_version_ids

          # Get all package versions and output them in format:
          # [
          #   {
          #     "id": package_id,
          #     "tag": package_first_tag,
          #     "created_at": date_package_was_pushed_to_ghcr
          #   }
          # ]
          PACKAGE_VERSIONS=$(gh api -H "Accept: application/vnd.github+json" /orgs/open-edge-platform/packages/container/${PACKAGE_NAME//\//%2F}/versions | jq '[.[] | {id, tag: .metadata.container.tags[0], created_at}]')

          # Filter PACKAGE_VERSIONS to contain only daily packages not release packages
          DAILY_PACKAGE_VERSIONS=$(echo $PACKAGE_VERSIONS | jq '[.[] | select(.tag != null and (.tag | type == "string") and (.tag | test("^[0-9]\\.[0-9]{1,2}\\.[0-9]-[a-z0-9]{8}$"))) | {id, tag, created_at}]')

          NOW=$(date +%s)
          CUTOFF=$((NOW - MAX_DAYS_OLD*86400))

          # Filter DAILY_PACKAGE_VERSIONS to contain only packages older than MAX_DAYS_OLD
          OLD_DAILY_PACKAGE_VERSIONS=$(echo "$DAILY_PACKAGE_VERSIONS" | jq --argjson cutoff "$CUTOFF" '[.[] | select((.created_at | strptime("%Y-%m-%dT%H:%M:%SZ") | mktime) < $cutoff)]')

          # Prepare output with packages to be removed
          package_version_ids=$(echo "$OLD_DAILY_PACKAGE_VERSIONS" | jq -r '.[].id' | paste -sd, -)
          echo "package_version_ids=$package_version_ids" >> $GITHUB_OUTPUT

  cleanup:
    runs-on: ubuntu-latest
    needs: prepare-vars
    if: ${{ !inputs.dry_run && needs.prepare-vars.outputs.package_version_ids != '' }}
    steps:
      - name: Cleanup old packages
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # v5.0.0
        with:
          package-name: '${{ github.event.inputs.package_name }}'
          package-type: 'container'
          package-version-ids: '${{ needs.prepare-vars.outputs.package_version_ids }}'
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
